<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D4E89">
<meta name="description" content="English 2 — تمرین‌نامهٔ تعاملی درس ۱">
<title>English 2</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ======== LESSON SCREEN: the one and only top bar (Step 9) ======== -->
<div id="ltop" style="display:none">
  <button class="lclose" id="ltClose" aria-label="بستن تمرین">✕</button>
  <div class="lbar" role="progressbar" aria-label="پیشرفت تمرین"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="ltBarWrap"><i id="ltBar"></i></div>
</div>

<main id="app"></main>

<nav class="bottom" id="bottomNav" aria-label="ناوبری اصلی">
  <button data-nav="home" class="on"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5"/><path d="M6.5 10.5V20h11v-9.5"/></svg><span>خانه</span></button>
  <button data-nav="cards"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="13" height="14" rx="2.5"/><path d="M8.5 3.5h9A2.5 2.5 0 0 1 20 6v11"/></svg><span>کارت‌ها</span></button>
  <button data-nav="review"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 3.5V7h3.5"/></svg><span>مرور</span></button>
  <button data-nav="stats"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5v-6"/><path d="M10 19.5V9"/><path d="M15.5 19.5v-8.5"/><path d="M21 19.5V4.5"/></svg><span>پیشرفت</span></button>
</nav>

<!-- ============ word/sentence popup (bottom sheet) ============ -->
<div id="overlay"><div id="sheet" role="dialog" aria-modal="true"><div class="grab" id="sheetClose"></div><div id="sheetBody"></div></div></div>

<!-- ============ answer feedback sheet (Step 3) ============ -->
<div id="fbSheet" role="status" aria-live="polite">
  <div class="panel">
    <div class="fbTop">
      <div class="fbIcon" id="fbIcon"></div>
      <p class="msg" id="fbMsg"></p>
    </div>
    <p class="ex" id="fbEx"></p>
    <button class="btn" id="fbBtn">ادامه</button>
  </div>
</div>

<!-- ============ confirm dialog (in-app, never window.confirm) ============ -->
<div id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="panel">
    <h3 id="dlgTitle"></h3>
    <p id="dlgBody"></p>
    <div class="row">
      <button class="btn sec" id="dlgNo"></button>
      <button class="btn" id="dlgYes"></button>
    </div>
  </div>
</div>

<div id="toast" aria-live="polite"></div>

<script src="content/glossary.js"></script>
<script src="content/lesson1.js"></script>
<script src="app/audio.js"></script>
<script src="app.js"></script>
</body>
</html>
